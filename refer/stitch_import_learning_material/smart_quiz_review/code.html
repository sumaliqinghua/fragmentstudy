<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart Quiz Review (Bright)</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#58cc02",
                        "primary-dark": "#46a302",
                        "primary-light": "#dfffc4",
                        "surface": "#ffffff",
                        "text-dark": "#2d3748",
                        "text-light": "#718096",
                        "divider": "#edf2f7",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 600, "GRAD" 0, "opsz" 24
    }.custom-radio:checked {
    background-color: #58cc02;
    border-color: #58cc02;
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCsDYFHTXU8RpmUu-FqvL2mBiVGtVHsoeWRiT2TNGnghjmaHxr0nhxTqek1FHlwZR93o6B8zi6btoKjQQ_2bPOH5o-PUh1APPeRLVXOnN4UkVeSUTZV6fjFDI_3JEftDotdZ13AhvOveF85Q1Gry4_Gyrk3TLkyjGuwpgTkMBfvE4mctre27wuvQj8xJt5_L28sr_DBDXO2WvGrcVfSeEiMFbKWWpMY5D2mGlH5ZluOwiczCkeY2r7Ox2g27k4u6op46CINjH5SppbF)
    }
.custom-radio:focus {
    box-shadow: none;
    outline: 2px solid #58cc02;
    outline-offset: 2px
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-text-dark font-display min-h-screen flex flex-col overflow-x-hidden antialiased selection:bg-primary-light selection:text-primary-dark">
<header class="flex flex-col w-full px-4 pt-6 pb-2 sticky top-0 bg-surface z-10">
<div class="flex items-center gap-4 mb-2">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-100 transition-colors text-slate-400">
<span class="material-symbols-outlined text-3xl">close</span>
</button>
<div class="flex-1 h-4 bg-gray-200 rounded-full overflow-hidden">
<div class="h-full bg-primary w-[30%] rounded-full relative">
<div class="absolute top-1 right-2 w-8 h-1.5 bg-white/30 rounded-full"></div>
</div>
</div>
<div class="flex items-center gap-1 text-red-500">
<span class="material-symbols-outlined fill-current text-3xl" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="font-bold text-lg">5</span>
</div>
</div>
</header>
<main class="flex-1 flex flex-col px-5 max-w-2xl mx-auto w-full pb-32">
<div class="flex items-center justify-center mt-4 mb-6">
<span class="text-primary text-xs font-bold uppercase tracking-widest bg-primary-light px-4 py-1.5 rounded-full">
            Question 3 of 10
        </span>
</div>
<div class="flex flex-col gap-6 mb-8">
<h2 class="text-2xl md:text-3xl font-bold leading-tight text-center text-slate-800">
            According to the uploaded material, what is the <span class="text-primary underline decoration-2 underline-offset-4">primary advantage</span> of utilizing Spaced Repetition?
        </h2>
<div class="flex items-center justify-center gap-2 text-slate-500 text-sm bg-slate-50 py-2 px-4 rounded-lg self-center border border-slate-100">
<span class="material-symbols-outlined text-lg">description</span>
<span class="font-medium">From "Learning_Strategies_Ch3.pdf"</span>
</div>
</div>
<div class="flex flex-col gap-4 w-full" role="radiogroup">
<label class="group relative flex items-center w-full p-4 rounded-2xl cursor-pointer transition-all duration-200 border-2 border-primary bg-green-50 shadow-[0_2px_0_#58cc02] transform scale-[1.01]">
<div class="flex-1 pr-3">
<p class="text-lg font-semibold text-slate-800">It significantly improves long-term memory retention.</p>
</div>
<input checked="" class="custom-radio w-6 h-6 border-2 border-slate-300 bg-white text-primary transition-all cursor-pointer" name="quiz_answer" type="radio"/>
</label>
<label class="group relative flex items-center w-full p-4 rounded-2xl cursor-pointer transition-all duration-200 border-2 border-slate-200 bg-white hover:bg-slate-50 shadow-[0_2px_0_#e2e8f0] hover:border-slate-300 active:translate-y-[2px] active:shadow-none">
<div class="flex-1 pr-3">
<p class="text-lg font-medium text-slate-600 group-hover:text-slate-800">It allows users to learn without studying.</p>
</div>
<input class="custom-radio w-6 h-6 border-2 border-slate-300 bg-white text-primary transition-all cursor-pointer" name="quiz_answer" type="radio"/>
</label>
<label class="group relative flex items-center w-full p-4 rounded-2xl cursor-pointer transition-all duration-200 border-2 border-slate-200 bg-white hover:bg-slate-50 shadow-[0_2px_0_#e2e8f0] hover:border-slate-300 active:translate-y-[2px] active:shadow-none">
<div class="flex-1 pr-3">
<p class="text-lg font-medium text-slate-600 group-hover:text-slate-800">It replaces the need for vocabulary lists entirely.</p>
</div>
<input class="custom-radio w-6 h-6 border-2 border-slate-300 bg-white text-primary transition-all cursor-pointer" name="quiz_answer" type="radio"/>
</label>
<label class="group relative flex items-center w-full p-4 rounded-2xl cursor-pointer transition-all duration-200 border-2 border-slate-200 bg-white hover:bg-slate-50 shadow-[0_2px_0_#e2e8f0] hover:border-slate-300 active:translate-y-[2px] active:shadow-none">
<div class="flex-1 pr-3">
<p class="text-lg font-medium text-slate-600 group-hover:text-slate-800">It increases reading speed by 200% instantly.</p>
</div>
<input class="custom-radio w-6 h-6 border-2 border-slate-300 bg-white text-primary transition-all cursor-pointer" name="quiz_answer" type="radio"/>
</label>
</div>
</main>
<footer class="fixed bottom-0 w-full bg-surface border-t-2 border-slate-100 p-4 pb-8 z-20">
<div class="max-w-2xl mx-auto flex flex-col gap-4">
<div class="flex justify-between px-2">
<button class="text-sm font-bold text-slate-400 hover:text-slate-600 uppercase tracking-wider flex items-center gap-2 transition-colors">
<span class="material-symbols-outlined text-xl">lightbulb</span> Hint
            </button>
<button class="text-sm font-bold text-slate-400 hover:text-slate-600 uppercase tracking-wider transition-colors">
                Skip
            </button>
</div>
<button class="w-full bg-primary hover:bg-[#4ac102] text-white text-lg font-extrabold py-4 rounded-2xl shadow-[0_4px_0_#46a302] active:shadow-none active:translate-y-[4px] transition-all uppercase tracking-widest flex items-center justify-center gap-2">
<span>Check Answer</span>
</button>
</div>
</footer>

</body></html>
